<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · ptygate</title>
    <style>
      :root { color-scheme: dark; --bg:#080c12; --panel:#101722; --line:#243143; --text:#e1e9f2; --muted:#8391a4; --accent:#49dba1; --danger:#ff7285; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 35%, #152335 0, var(--bg) 58%);
        color: var(--text);
        font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width:min(390px,calc(100vw - 32px)); }
      .brand { margin:0 0 12px 2px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
      form {
        padding: 30px;
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 22px 70px #0007;
      }
      h1 { margin: 0 0 6px; font-size: 22px; letter-spacing:-.03em; font-weight: 680; }
      p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
      label { display:block; margin-bottom:7px; color:#b7c3d1; font-size:12px; font-weight:600; }
      input {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        color: inherit;
        background: #080c12;
        border: 1px solid #2a394d;
        border-radius: 8px;
        outline: none;
        transition:border-color .15s, box-shadow .15s;
      }
      input:focus { border-color: var(--accent); box-shadow:0 0 0 3px #49dba122; }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 10px 12px;
        font: inherit;
        color: #07130f;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover { background: #69e8b3; }
      button:focus-visible { outline:2px solid white; outline-offset:3px; }
      .err {
        margin: 0 0 14px;
        padding: 8px 10px;
        color: var(--danger);
        background: #2a1018;
        border: 1px solid #653044;
        border-radius: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
    <div class="brand">ptygate · secure access</div>
    <form method="post" action="/login">
      <h1>Welcome back</h1>
      <p>Enter your server access token to open the terminal.</p>
      <div class="err" id="err" style="display: none">Wrong token. Try again.</div>
      <label for="token">Access token</label>
      <input
        id="token"
        type="password"
        name="token"
        placeholder="Paste your access token"
        autocomplete="current-password"
        autofocus
        required
      />
      <button type="submit">Open terminal</button>
    </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("err").style.display = "block";
      }
    </script>
  </body>
</html>
