<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>terminal</title>
    <link rel="stylesheet" href="/assets/xterm.css" />
    <style>
      :root {
        --bg: #080c12;
        --bar: #101722;
        --panel: #0e151f;
        --line: #243143;
        --text: #e1e9f2;
        --muted: #8391a4;
        --ok: #49dba1;
        --warn: #f4c76b;
        --bad: #ff7285;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: linear-gradient(180deg, #131c28, var(--bar));
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
      .dot.off { background: var(--bad); }
      #status { color: var(--muted); }
      .spacer { flex: 1; }
      button {
        font: inherit;
        color: var(--text);
        background: #182231;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 11px;
        cursor: pointer;
      }
      button:hover { background: #243246; border-color: #3a4b62; }
      button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
      .brand { font-weight: 700; letter-spacing: .02em; }
      .status-group { display: flex; align-items: center; gap: 9px; }
      .toolbar { display:flex; align-items:center; gap:8px; }
      .shell-card { flex: 1 1 auto; min-height: 0; margin: 12px 14px 14px; padding: 8px 8px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 42px #0005; }
      #wrap { height: 100%; min-height: 0; }
      .xterm { height: 100%; }
      .xterm .xterm-viewport { background: transparent !important; }
      .metrics { display:flex; align-items:stretch; gap:8px; padding:8px 14px 0; }
      .metric { min-width:110px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#0d141e; }
      .metric-label { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
      .metric-value { display:block; margin-top:2px; font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; }
      .metric-track { height:3px; margin-top:6px; overflow:hidden; background:#263141; border-radius:4px; }
      .metric-fill { height:100%; width:0; background:var(--ok); transition:width .35s ease; }
      #metrics-status { align-self:center; color:var(--muted); font-size:11px; }
      @media (max-width: 640px) { header { padding:9px 10px; gap:7px; } .brand { display:none; } .metrics { padding:7px 9px 0; gap:5px; } .metric { flex:1; min-width:0; padding:6px 7px; } .shell-card { margin:9px 8px 8px; } button { padding:7px 8px; } }
      #banner {
        display: none;
        padding: 6px 12px;
        background: #2a1f00;
        color: var(--warn);
        border-bottom: 1px solid #4a3800;
      }
      #banner.show { display: block; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">ptygate <span style="color:var(--muted);font-weight:400">/ terminal</span></span>
      <span class="status-group"><span class="dot off" id="dot"></span><span id="status">connecting...</span></span>
      <span class="spacer"></span>
      <div class="toolbar">
        <button id="copy" type="button" title="Copy selected text (Ctrl/Cmd+Shift+C)">Copy</button>
        <button id="paste" type="button" title="Paste from clipboard (Ctrl/Cmd+Shift+V)">Paste</button>
        <button id="reconnect" type="button">Reconnect</button>
        <form method="post" action="/logout" style="margin:0">
          <button type="submit">Log out</button>
        </form>
      </div>
    </header>

    <div id="banner"></div>
    <section class="metrics" aria-label="Container resource usage">
      <div class="metric"><span class="metric-label">CPU</span><span class="metric-value" id="cpu-value">--</span><div class="metric-track"><div class="metric-fill" id="cpu-fill"></div></div></div>
      <div class="metric"><span class="metric-label">Memory</span><span class="metric-value" id="memory-value">--</span><div class="metric-track"><div class="metric-fill" id="memory-fill"></div></div></div>
      <div class="metric"><span class="metric-label">App filesystem</span><span class="metric-value" id="storage-value">--</span><div class="metric-track"><div class="metric-fill" id="storage-fill"></div></div></div>
      <span id="metrics-status" role="status">loading usage…</span>
    </section>
    <main class="shell-card"><div id="wrap"></div></main>

    <script src="/assets/xterm.js"></script>
    <script src="/assets/addon-fit.js"></script>
    <script>
      const dot = document.getElementById("dot");
      const statusEl = document.getElementById("status");
      const banner = document.getElementById("banner");
      const formatBytes = (value) => {
        if (!Number.isFinite(value)) return "unavailable";
        const units = ["B", "KB", "MB", "GB", "TB"];
        let size = value, unit = 0;
        while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit++; }
        return `${size.toFixed(unit ? 1 : 0)} ${units[unit]}`;
      };

      async function refreshMetrics() {
        try {
          const response = await fetch("/api/terminal/metrics", { cache: "no-store" });
          if (!response.ok) throw new Error("metrics unavailable");
          const data = await response.json();
          const memoryPercent = data.memory?.total ? (data.memory.used / data.memory.total) * 100 : null;
          const diskPercent = data.filesystem?.total ? (data.filesystem.used / data.filesystem.total) * 100 : null;
          document.getElementById("cpu-value").textContent = data.cpuPercent === null ? "unavailable" : `${data.cpuPercent.toFixed(1)}%`;
          document.getElementById("memory-value").textContent = data.memory ? `${formatBytes(data.memory.used)} / ${formatBytes(data.memory.total)}` : "unavailable";
          document.getElementById("storage-value").textContent = data.filesystem ? `${formatBytes(data.filesystem.used)} / ${formatBytes(data.filesystem.total)}` : "unavailable";
          document.getElementById("cpu-fill").style.width = `${Math.min(100, data.cpuPercent || 0)}%`;
          document.getElementById("memory-fill").style.width = `${Math.min(100, memoryPercent)}%`;
          document.getElementById("storage-fill").style.width = `${Math.min(100, diskPercent || 0)}%`;
          document.getElementById("metrics-status").textContent = "live · 3s";
        } catch {
          document.getElementById("metrics-status").textContent = "usage unavailable";
        }
      }

      function setStatus(text, state) {
        statusEl.textContent = text;
        dot.className = "dot " + (state || "");
      }

      function showBanner(text) {
        banner.textContent = text;
        banner.classList.add("show");
      }

      const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
        scrollback: 5000,
        theme: {
          background: "#0e151f",
          foreground: "#e1e9f2",
          cursor: "#49dba1",
          selectionBackground: "#33506a",
          black: "#080c12",
          red: "#ff7285",
          green: "#49dba1",
          yellow: "#f4c76b",
          blue: "#58a6ff",
          magenta: "#bc8cff",
          cyan: "#39c5cf",
          white: "#b1bac4",
        },
      });

      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("wrap"));
      fit.fit();
      term.focus();

      async function copySelection() {
        const selected = term.getSelection();
        if (!selected) { showBanner("Select text in the terminal first, then choose Copy."); return; }
        try {
          if (navigator.clipboard?.writeText && window.isSecureContext) {
            await navigator.clipboard.writeText(selected);
          } else {
            const area = document.createElement("textarea");
            area.value = selected;
            area.setAttribute("readonly", "");
            area.style.cssText = "position:fixed;left:-9999px;top:0";
            document.body.append(area);
            area.select();
            const copied = document.execCommand("copy");
            area.remove();
            if (!copied) throw new Error("copy unavailable");
          }
          banner.classList.remove("show");
        } catch {
          showBanner("Copy was blocked by the browser. Try HTTPS, or select the text and use your browser’s Copy command.");
        }
      }

      async function pasteClipboard() {
        try {
          if (!navigator.clipboard?.readText || !window.isSecureContext) {
            throw new Error("Paste requires a secure page and browser clipboard permission");
          }
          const text = await navigator.clipboard.readText();
          if (text && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "input", data: text }));
            term.focus();
          } else if (!text) showBanner("Clipboard is empty.");
          else showBanner("Reconnect before pasting into the terminal.");
        } catch {
          showBanner("Paste needs HTTPS and clipboard permission. You can also paste with Ctrl/Cmd+V while the terminal is focused.");
        }
      }

      document.getElementById("copy").addEventListener("click", copySelection);
      document.getElementById("paste").addEventListener("click", pasteClipboard);
      document.addEventListener("keydown", (event) => {
        if (event.target.closest("button, input, textarea")) return;
        if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "c" && term.hasSelection()) { event.preventDefault(); copySelection(); }
        if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "v") { event.preventDefault(); pasteClipboard(); }
      });
      refreshMetrics();
      const metricsTimer = setInterval(refreshMetrics, 3000);
      window.addEventListener("beforeunload", () => clearInterval(metricsTimer));

      let ws = null;
      let attempt = 0;
      let manual = false;

      function sendResize() {
        try {
          fit.fit();
        } catch {}
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${proto}//${location.host}/ws`, "ptygate.v1");
        setStatus("connecting...", "");

        ws.onopen = () => {
          attempt = 0;
          setStatus("connected", "on");
          sendResize();
          term.focus();
        };

        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch {
            return;
          }
          if (msg.type === "output") {
            term.write(msg.data);
          } else if (msg.type === "exit") {
            term.write(
              `\r\n\x1b[33m[process exited: code ${msg.exitCode}` +
                (msg.signal ? `, signal ${msg.signal}` : "") +
                `]\x1b[0m\r\n`,
            );
            setStatus("session ended", "off");
            showBanner("Shell exited. Press reconnect to start a new one.");
          }
        };

        ws.onclose = () => {
          if (manual) return;
          setStatus("disconnected", "off");
          const delay = Math.min(1000 * 2 ** attempt, 15000);
          attempt += 1;
          showBanner(`Connection lost. Reconnecting in ${delay / 1000}s...`);
          setTimeout(() => {
            if (!manual) connect();
          }, delay);
        };

        ws.onerror = () => setStatus("connection error", "off");
      }

      term.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input", data }));
        }
      });

      term.onResize(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      });

      let t;
      window.addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(sendResize, 100);
      });

      document.getElementById("reconnect").addEventListener("click", () => {
        manual = true;
        banner.classList.remove("show");
        if (ws) ws.close();
        ws = null;
        manual = false;
        attempt = 0;
        connect();
      });

      // Keep focus on the terminal, but let the header buttons be clickable.
      document.addEventListener("click", (e) => {
        if (!e.target.closest("header")) term.focus();
      });

      connect();
    </script>
  </body>
</html>
